# 쿼리도 — Cloudflare Workers 무료 플랜
# 화면 파일은 정적 자산으로, 소켓(/ws)만 Worker → Durable Object 로 간다.
# 무료 플랜에서는 SQLite 저장소 방식의 Durable Object 만 쓸 수 있다(new_sqlite_classes). 저장소는 쓰지 않는다.
name = "quoridor"
main = "worker.js"
compatibility_date = "2026-08-01"
# process.env 를 쓰려고 켠다 — 시험 때만 --var QUORIDOR_FAST:1 로 판을 빨리 돌린다.
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/ws", "/healthz"]

[[durable_objects.bindings]]
name = "GAME"
class_name = "QuoridorGame"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["QuoridorGame"]
